[package]
name = "yarddog"
version = "0.1.4"
edition = "2021"
description = "Yard Dog — path-intelligence and existence-guard core for single-host Docker/Compose"
license = "AGPL-3.0-or-later"

[lib]
name = "yarddog"
path = "src/lib.rs"

[[bin]]
name = "yd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
bollard = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sha2 = "0.10"
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
