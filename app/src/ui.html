<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yard Dog</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --panel-2: #efede8; --ink: #1e1c19; --muted: #6d6a63;
    --line: #e2ded6; --accent: #c9871f; --accent-ink: #7a4f08;
    --ok: #2f9e59; --warn: #c9871f; --bad: #cf4141; --info: #3b6fd4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17150f; --panel: #201d16; --panel-2: #2a251c; --ink: #ece7db; --muted: #a49d8c;
      --line: #322c22; --accent: #e0a94a; --accent-ink: #f2cd85;
      --ok: #56c07f; --warn: #e0a94a; --bad: #e86a6a; --info: #6f9bf0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17150f; --panel: #201d16; --panel-2: #2a251c; --ink: #ece7db; --muted: #a49d8c;
    --line: #322c22; --accent: #e0a94a; --accent-ink: #f2cd85;
    --ok: #56c07f; --warn: #e0a94a; --bad: #e86a6a; --info: #6f9bf0;
  }
  :root[data-theme="light"] {
    --bg: #f6f5f2; --panel: #ffffff; --panel-2: #efede8; --ink: #1e1c19; --muted: #6d6a63;
    --line: #e2ded6; --accent: #c9871f; --accent-ink: #7a4f08;
    --ok: #2f9e59; --warn: #c9871f; --bad: #cf4141; --info: #3b6fd4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header.top {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .paw { color: var(--accent); font-size: 20px; }
  .brand small { font-weight: 500; color: var(--muted); letter-spacing: .02em; }
  .top .spacer { flex: 1; }
  .loopback { font: 12px/1 var(--mono); color: var(--muted); border: 1px solid var(--line);
    padding: 5px 8px; border-radius: 6px; background: var(--panel-2); }
  .loopback b { color: var(--ok); }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel-2);
    color: var(--ink); padding: 6px 11px; border-radius: 7px; transition: background .12s, border-color .12s;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #17150f; border-color: var(--accent); font-weight: 600; }
  button.danger { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); color: var(--bad); }
  button.danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 58px); }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  aside {
    border-right: 1px solid var(--line); background: var(--panel); padding: 12px;
    overflow-y: auto;
  }
  .rail-head { display: flex; align-items: center; gap: 8px; margin: 4px 4px 12px; }
  .rail-head input {
    flex: 1; min-width: 0; font: 13px/1 var(--mono); padding: 7px 9px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .stack-item {
    width: 100%; text-align: left; display: flex; flex-direction: column; gap: 4px;
    padding: 10px 11px; border-radius: 9px; border: 1px solid transparent; background: transparent; margin-bottom: 3px;
  }
  .stack-item:hover { background: var(--panel-2); }
  .stack-item.active { background: var(--panel-2); border-color: var(--line); }
  .stack-item .nm { font-weight: 600; }
  .stack-item .sub { font: 12px/1.3 var(--mono); color: var(--muted); display: flex; gap: 8px; align-items: center; }

  main { padding: 20px 24px; overflow-y: auto; }
  .empty { color: var(--muted); max-width: 46ch; margin-top: 8vh; }
  .empty h2 { color: var(--ink); font-weight: 650; }

  .detail-head { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 4px; }
  .detail-head h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .path { font: 12px/1 var(--mono); color: var(--muted); margin-bottom: 16px; word-break: break-all; }

  .badge { font: 600 12px/1 system-ui; padding: 5px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.ready { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .badge.notready { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .chip { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .04em;
    padding: 4px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .chip.draft { color: var(--muted); }
  .chip.active { color: var(--ok); }
  .chip.deprecated { color: var(--warn); }
  .chip.archived { color: var(--bad); }

  .actionbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 22px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }

  section h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font: 600 12px/1 system-ui; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  td.img { font: 13px/1.3 var(--mono); word-break: break-all; }
  .kind { font: 600 11px/1 var(--mono); text-transform: uppercase; padding: 3px 7px; border-radius: 5px;
    background: color-mix(in srgb, var(--info) 14%, transparent); color: var(--info); }
  .kind.datastore { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
  .kind.proxy { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-ink); }

  .finding { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--line); }
  .finding .sev { font: 600 11px/1 var(--mono); text-transform: uppercase; padding: 3px 6px; border-radius: 5px; flex: none; }
  .finding.block { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
  .finding.block .sev { background: var(--bad); color: #fff; }
  .finding.warn .sev { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  .finding .msg { flex: 1; }
  .finding .svc { font: 12px/1 var(--mono); color: var(--muted); }
  .clean { color: var(--ok); font-size: 14px; }

  .console { margin-top: 26px; }
  .console pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    font: 12.5px/1.55 var(--mono); color: var(--ink); max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  .console .line-ok { color: var(--ok); }
  .console .line-bad { color: var(--bad); }
  .console .line-cmd { color: var(--accent-ink); font-weight: 600; }
  .console .line-dim { color: var(--muted); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -1px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="paw">◕</span> Yard&nbsp;Dog <small>control plane</small></div>
  <div class="spacer"></div>
  <span class="loopback">🔒 <b>loopback</b> · 127.0.0.1</span>
  <button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
</header>

<div class="layout">
  <aside>
    <div class="rail-head">
      <input id="filter" placeholder="filter stacks…" autocomplete="off" />
      <button id="refresh" title="Reload stacks">↻</button>
    </div>
    <div id="stacks"></div>
  </aside>
  <main id="main">
    <div class="empty">
      <h2>Select a stack</h2>
      <p>Yard Dog is serving the stacks discovered under your working directory. Pick one on the left to see its services, guardrail check, and lifecycle — and to deploy, upgrade, back up, or check drift.</p>
    </div>
  </main>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
let current = null, stacksCache = [];

// theme
const themeBtn = $("#theme");
themeBtn.onclick = () => {
  const now = document.documentElement.getAttribute("data-theme");
  const next = now === "dark" ? "light" : (now === "light" ? "dark" : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"));
  document.documentElement.setAttribute("data-theme", next);
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  try { return { ok: r.ok, data: JSON.parse(t) }; } catch { return { ok: r.ok, data: { raw: t } }; }
}

async function loadStacks() {
  const box = $("#stacks");
  box.innerHTML = "";
  const { data } = await api("/api/stacks");
  stacksCache = data.stacks || [];
  if (!stacksCache.length) { box.append(el("p", "empty", "No compose stacks found under the served root.")); return; }
  renderStacks();
}
function renderStacks() {
  const box = $("#stacks"); box.innerHTML = "";
  const f = $("#filter").value.toLowerCase();
  for (const s of stacksCache) {
    if (f && !s.name.toLowerCase().includes(f)) continue;
    const b = el("button", "stack-item" + (current === s.compose ? " active" : ""));
    b.append(el("span", "nm", s.name));
    const sub = el("span", "sub");
    sub.append(el("span", "chip " + s.lifecycle, s.lifecycle));
    sub.append(el("span", null, s.services + " svc"));
    b.append(sub);
    b.onclick = () => selectStack(s.compose);
    box.append(b);
  }
}
$("#filter").oninput = renderStacks;
$("#refresh").onclick = loadStacks;

async function selectStack(compose) {
  current = compose; renderStacks();
  const main = $("#main"); main.innerHTML = "Loading…";
  const { ok, data } = await api("/api/stack?compose=" + encodeURIComponent(compose));
  if (!ok) { main.innerHTML = ""; main.append(el("p", "empty", "Could not load stack.")); return; }
  renderDetail(data);
}

function renderDetail(d) {
  const main = $("#main"); main.innerHTML = "";
  const head = el("div", "detail-head");
  const name = (stacksCache.find(s => s.compose === d.compose) || {}).name || d.compose;
  head.append(el("h1", null, name));
  head.append(el("span", "badge " + (d.ready ? "ready" : "notready"), d.ready ? "READY" : "NOT READY"));
  head.append(el("span", "chip " + d.lifecycle, d.lifecycle));
  main.append(head);
  main.append(el("div", "path", d.compose));

  // actions
  const bar = el("div", "actionbar");
  const act = (label, cls, fn) => { const b = el("button", cls, label); b.onclick = fn; bar.append(b); return b; };
  act("Deploy", "primary", () => confirmAction("Deploy this stack? Yard Dog will back up, snapshot, and health-gate the change.", "/api/deploy", { compose: d.compose }, "deploy"));
  act("Drift", "", () => runRead("/api/drift?compose=" + encodeURIComponent(d.compose), "drift"));
  act("Updates", "", () => runRead("/api/updates?compose=" + encodeURIComponent(d.compose), "updates"));
  act("Back up", "", () => confirmAction("Run an application-consistent backup of this stack?", "/api/backup", { compose: d.compose }, "backup"));
  // lifecycle transitions relevant to the current state
  const transitions = { draft: ["activate", "archive"], active: ["deprecate", "archive"], deprecated: ["activate", "archive"], archived: ["restore"] };
  for (const ev of (transitions[d.lifecycle] || [])) {
    act(ev[0].toUpperCase() + ev.slice(1), "", () => doAction("/api/lifecycle", { compose: d.compose, event: ev }, "lifecycle " + ev).then(() => selectStack(d.compose)));
  }
  act("Down", "danger", () => confirmAction("Stop and remove this stack's containers? (docker compose down)", "/api/down", { compose: d.compose }, "down"));
  main.append(bar);

  // services
  const svcSec = el("section");
  svcSec.append(el("h3", null, "Services"));
  const table = el("table");
  const thead = el("tr");
  ["Service", "Image", "Kind", ""].forEach(h => thead.append(el("th", null, h)));
  table.append(thead);
  for (const s of d.services) {
    const tr = el("tr");
    tr.append(el("td", null, s.name));
    tr.append(el("td", "img", s.image || "—"));
    tr.append((() => { const td = el("td"); td.append(el("span", "kind " + s.kind, s.kind)); return td; })());
    const up = el("td");
    const b = el("button", "", "Upgrade…");
    b.onclick = () => {
      const img = prompt(`New image for “${s.name}” (current: ${s.image || "?"}):`, s.image || "");
      if (img && img !== s.image) confirmAction(`Upgrade ${s.name} to ${img}? It will health-gate and roll back on failure.`, "/api/upgrade", { compose: d.compose, service: s.name, image: img }, "upgrade " + s.name);
    };
    up.append(b); tr.append(up);
    table.append(tr);
  }
  svcSec.append(table);
  main.append(svcSec);

  // guardrails
  const gSec = el("section");
  gSec.append(el("h3", null, `Guardrails — ${d.blocks} blocking, ${d.warns} warning${d.warns === 1 ? "" : "s"}`));
  if (!d.guardrails.length) {
    gSec.append(el("div", "clean", "✓ No guardrail findings."));
  } else {
    for (const f of d.guardrails) {
      const row = el("div", "finding " + f.severity);
      row.append(el("span", "sev", f.severity));
      const msg = el("span", "msg"); msg.append(el("span", "svc", f.service + " · ")); msg.append(document.createTextNode(f.message));
      row.append(msg);
      gSec.append(row);
    }
  }
  main.append(gSec);

  // console
  const cSec = el("section", "console");
  cSec.append(el("h3", null, "Output"));
  const pre = el("pre"); pre.id = "console"; pre.append(el("span", "line-dim", "Actions and checks print here."));
  cSec.append(pre);
  main.append(cSec);
}

function logLine(cls, text) {
  const pre = $("#console"); if (!pre) return;
  if (pre.firstChild && pre.firstChild.className === "line-dim") pre.innerHTML = "";
  pre.append(el("span", cls, text + "\n")); pre.scrollTop = pre.scrollHeight;
}

async function confirmAction(msg, path, body, label) {
  if (!confirm(msg)) return;
  return doAction(path, body, label);
}
async function doAction(path, body, label) {
  logLine("line-cmd", "▶ yd " + label);
  const busy = el("span", null); busy.innerHTML = ' <span class="spin"></span>'; $("#console")?.append(busy);
  try {
    const { data } = await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    busy.remove();
    if (data.error) { logLine("line-bad", "✗ " + data.error); return; }
    if (data.stdout && data.stdout.trim()) logLine("", data.stdout.trimEnd());
    if (data.stderr && data.stderr.trim()) logLine("line-dim", data.stderr.trimEnd());
    logLine(data.ok ? "line-ok" : "line-bad", (data.ok ? "✓ done" : "✗ failed") + " (exit " + data.exit + ")");
    loadStacks();
  } catch (e) { busy.remove(); logLine("line-bad", "✗ " + e); }
}
async function runRead(path, label) {
  logLine("line-cmd", "▶ yd " + label);
  const { data } = await api(path);
  if (data.error) { logLine("line-bad", "✗ " + data.error); return; }
  if (data.stdout && data.stdout.trim()) logLine("", data.stdout.trimEnd());
  else logLine("line-dim", "(no output)");
}

loadStacks();
</script>
</body>
</html>
