<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yard Dog</title>
<style>
  /* ---- Yard Dog: a container-terminal control plane. Industrial, grounded,
     technical. Petrol/steel is the BRAND accent only; status has its own
     green/amber/red/blue system so warnings never blend into the brand. ---- */
  :root {
    --ground:#EBEDF0; --panel:#FFFFFF; --panel-2:#E3E6EA; --sunken:#F4F5F7;
    --ink:#15181C; --ink-2:#3a4048; --muted:#616772; --line:#D3D7DD; --line-2:#c3c8cf;
    --accent:#0C6B75; --accent-ink:#084A52; --accent-wash:#0c6b7514;
    --ok:#1F8A55; --warn:#B8801A; --bad:#C13B3B; --info:#2F66CC;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --dock-h:210px; --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.06);
    --r:9px;
  }
  @media (prefers-color-scheme:dark){ :root{
    --ground:#111418; --panel:#191D22; --panel-2:#222831; --sunken:#14181d;
    --ink:#E7EAED; --ink-2:#c2c8d0; --muted:#98A0AA; --line:#2A3039; --line-2:#39414c;
    --accent:#2AA7B5; --accent-ink:#7FD4DE; --accent-wash:#2aa7b51f;
    --ok:#4FBF83; --warn:#DCA340; --bad:#E06666; --info:#6C9BF0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); } }
  :root[data-theme="dark"]{
    --ground:#111418; --panel:#191D22; --panel-2:#222831; --sunken:#14181d;
    --ink:#E7EAED; --ink-2:#c2c8d0; --muted:#98A0AA; --line:#2A3039; --line-2:#39414c;
    --accent:#2AA7B5; --accent-ink:#7FD4DE; --accent-wash:#2aa7b51f;
    --ok:#4FBF83; --warn:#DCA340; --bad:#E06666; --info:#6C9BF0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); }
  :root[data-theme="light"]{
    --ground:#EBEDF0; --panel:#FFFFFF; --panel-2:#E3E6EA; --sunken:#F4F5F7;
    --ink:#15181C; --ink-2:#3a4048; --muted:#616772; --line:#D3D7DD; --line-2:#c3c8cf;
    --accent:#0C6B75; --accent-ink:#084A52; --accent-wash:#0c6b7514;
    --ok:#1F8A55; --warn:#B8801A; --bad:#C13B3B; --info:#2F66CC;
    --shadow:0 1px 2px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.06); }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--ground);color:var(--ink);font:14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .eyebrow{font:600 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.11em;color:var(--muted);}

  /* header */
  header.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:26px;height:22px;flex:none;color:var(--accent);}
  .brand .word{font:800 15px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;}
  .brand .word b{color:var(--accent);font-weight:800;}
  .brand .tag{font:500 11px/1 var(--sans);color:var(--muted);letter-spacing:.02em;}
  .top .sp{flex:1;}
  .lock{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);color:var(--muted);border:1px solid var(--line);background:var(--sunken);padding:6px 9px;border-radius:7px;}
  .lock b{color:var(--ok);}
  .navbtn{display:inline-flex;align-items:center;gap:7px;font:600 12.5px/1 var(--sans);cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 11px;border-radius:8px;transition:border-color .12s,background .12s;}
  .navbtn:hover{border-color:var(--accent);}
  .navbtn.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash);}
  .navbtn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .navbtn .cnt{font:700 10px/1 var(--mono);background:var(--bad);color:#fff;border-radius:999px;padding:2px 5px;}

  /* generic button */
  button{font:inherit;}
  .btn{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--sans);cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:8px;transition:border-color .12s,background .12s;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.danger{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad);}
  .btn.danger:hover{background:color-mix(in srgb,var(--bad) 12%,transparent);}
  .btn.sm{padding:5px 9px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* layout */
  .layout{display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0;}
  @media(max-width:860px){.layout{grid-template-columns:1fr;}}
  aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;}
  .rail-top{padding:12px 12px 8px;display:flex;flex-direction:column;gap:9px;}
  .rail-top .lbl{display:flex;align-items:center;justify-content:space-between;}
  .rail-top input{width:100%;font:13px/1 var(--mono);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--sunken);color:var(--ink);}
  .rail-list{flex:1;overflow-y:auto;padding:2px 10px 12px;}
  .rail-foot{padding:10px 12px;border-top:1px solid var(--line);}
  .srow{width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid transparent;background:transparent;cursor:pointer;margin-bottom:2px;}
  .srow:hover{background:var(--sunken);}
  .srow.active{background:var(--accent-wash);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));}
  .srow .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .srow .nm{font-weight:650;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .srow .meta{font:11.5px/1 var(--mono);color:var(--muted);display:flex;gap:8px;}
  .srow .n{font:700 11px/1 var(--mono);padding:3px 7px;border-radius:999px;flex:none;}
  .srow .n.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);}
  .srow .n.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);}
  .srow .n.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);}

  /* status signal light */
  .sig{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted);box-shadow:0 0 0 3px color-mix(in srgb,var(--muted) 16%,transparent);}
  .sig.ok{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent);}
  .sig.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 22%,transparent);}
  .sig.bad{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent);}
  .sig.info{background:var(--info);box-shadow:0 0 0 3px color-mix(in srgb,var(--info) 20%,transparent);}

  /* main */
  main{overflow-y:auto;padding:20px 26px 26px;min-height:0;}
  .empty{max-width:52ch;margin-top:8vh;color:var(--muted);}
  .empty h2{color:var(--ink);font-weight:700;letter-spacing:-.01em;margin:0 0 6px;}
  .empty .big{width:46px;height:38px;color:var(--line-2);margin-bottom:14px;}

  .dhead{display:flex;align-items:center;flex-wrap:wrap;gap:12px;}
  .dhead h1{font-size:21px;margin:0;letter-spacing:-.015em;}
  .dhead .path{width:100%;font:12px/1 var(--mono);color:var(--muted);word-break:break-all;margin-top:-2px;}
  .pill{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--sans);padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);}
  .pill.ready{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line));background:color-mix(in srgb,var(--ok) 10%,transparent);}
  .pill.notready{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line));background:color-mix(in srgb,var(--bad) 10%,transparent);}
  .pill.life{text-transform:capitalize;}

  .tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin:16px 0 18px;flex-wrap:wrap;}
  .tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:9px 13px;color:var(--muted);font:650 13px/1 var(--sans);cursor:pointer;border-radius:0;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink);border-color:var(--accent);}

  .bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  section{margin-bottom:6px;}
  h3.sec{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 0 10px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  th{font:600 10.5px/1 var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--sunken);}
  td.m{font-family:var(--mono);font-variant-numeric:tabular-nums;word-break:break-all;}

  .type{font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.03em;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel-2);}
  .type.host-bind{color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,var(--line));background:color-mix(in srgb,var(--info) 9%,transparent);}
  .type.named-volume{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));background:var(--accent-wash);}
  .type.anonymous{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,var(--line));background:color-mix(in srgb,var(--warn) 10%,transparent);}
  .type.network,.type.tmpfs{color:var(--muted);}
  .type.port{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line));background:color-mix(in srgb,var(--ok) 9%,transparent);}

  .chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--sans);padding:4px 8px;border-radius:999px;margin-right:6px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);}
  .chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 11%,transparent);border-color:transparent;}
  .chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:transparent;}
  .chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:transparent;}
  .chip.dim{color:var(--muted);}
  .chip .auto{opacity:.72;font-weight:600;}

  .issue{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--panel);}
  .issue .sev{font:700 10px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:4px 6px;border-radius:5px;flex:none;margin-top:1px;}
  .issue.block{border-color:color-mix(in srgb,var(--bad) 40%,var(--line));}
  .issue.block .sev{background:var(--bad);color:#fff;}
  .issue.warn .sev{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn);}
  .issue.info .sev{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info);}
  .issue .src{font:12px/1.4 var(--mono);color:var(--muted);}
  .clean{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:600;padding:10px 0;}

  /* editor */
  .edit{display:flex;gap:16px;align-items:flex-start;}
  .edit .main{flex:1;min-width:0;}
  textarea.editor{width:100%;min-height:360px;font:13px/1.55 var(--mono);padding:13px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);color:var(--ink);resize:vertical;tab-size:2;}
  .vpanel{width:270px;flex:none;}
  .vpanel .head{font:600 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:9px;}
  pre.diff{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;font:12.5px/1.5 var(--mono);overflow:auto;max-height:440px;white-space:pre;margin:0;}
  pre.diff .add{color:var(--ok);} pre.diff .del{color:var(--bad);} pre.diff .hdr{color:var(--accent-ink);}
  ul.hist{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);}
  ul.hist li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);}
  ul.hist li:last-child{border-bottom:none;}
  ul.hist .sha{font:12px/1 var(--mono);color:var(--accent-ink);}
  ul.hist .msg{flex:1;}

  /* inline forms */
  .form{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;max-width:640px;box-shadow:var(--shadow);}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .field input{font:14px/1.3 var(--mono);padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--sunken);color:var(--ink);}
  .field .hint{font:12px/1.4 var(--sans);color:var(--muted);}
  .preview{font:12px/1.5 var(--mono);background:var(--sunken);border:1px dashed var(--line);border-radius:8px;padding:11px 13px;white-space:pre;overflow:auto;max-height:220px;color:var(--ink-2);}

  /* confirm / toast banner */
  #banner{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,92vw);}
  #banner>*{pointer-events:auto;width:100%;}
  .confirm{background:var(--panel);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:13px 15px;display:flex;align-items:center;gap:12px;}
  .confirm .txt{flex:1;font-size:13.5px;}
  .toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;box-shadow:var(--shadow);padding:11px 14px;font-size:13px;display:flex;align-items:center;gap:9px;animation:slidein .16s ease;}
  .toast.ok{border-left-color:var(--ok);} .toast.bad{border-left-color:var(--bad);} .toast.warn{border-left-color:var(--warn);}
  @keyframes slidein{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

  /* console dock */
  .dock{flex:none;z-index:30;background:var(--panel);border-top:1px solid var(--line-2);box-shadow:0 -6px 20px rgba(0,0,0,.06);display:flex;flex-direction:column;height:var(--dock-h);transition:height .16s ease;}
  .dock.collapsed{height:38px;}
  .dock-bar{display:flex;align-items:center;gap:10px;height:38px;padding:0 14px;cursor:pointer;flex:none;border-bottom:1px solid var(--line);}
  .dock-bar .ttl{font:700 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .dock-bar .last{flex:1;min-width:0;font:12px/1 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dock-bar .x{display:inline-flex;gap:4px;}
  .dock-body{flex:1;overflow:auto;padding:10px 14px;background:var(--sunken);}
  .dock.collapsed .dock-body{display:none;}
  #console{font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;margin:0;}
  #console .cmd{color:var(--accent-ink);font-weight:700;} #console .ok{color:var(--ok);} #console .bad{color:var(--bad);} #console .dim{color:var(--muted);} #console .warn{color:var(--warn);font-weight:700;}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  @media(prefers-reduced-motion:reduce){.spin{animation:none;}.toast{animation:none;}.dock{transition:none;}}
  .muted{color:var(--muted);}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 34 28" fill="none" aria-hidden="true">
      <rect x="1.5" y="7" width="24" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
      <path d="M7 7v14M12.5 7v14M18 7v14" stroke="currentColor" stroke-width="1.4" opacity=".7"/>
      <path d="M25.5 11h4.2l2.8 3.2V21h-7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="9" cy="23.5" r="2.4" fill="currentColor"/><circle cx="27" cy="23.5" r="2.4" fill="currentColor"/>
    </svg>
    <div>
      <div class="word">Yard<b>Dog</b></div>
    </div>
    <span class="tag">container control plane</span>
  </div>
  <div class="sp"></div>
  <span class="lock">🔒 <b>loopback</b> · 127.0.0.1</span>
  <button class="navbtn" id="nav-all" title="Every stack under the served root">▤ All stacks</button>
  <button class="navbtn" id="nav-git" title="Sync config with a Git remote"><span class="sig" id="git-sig"></span> Git</button>
  <button class="navbtn" id="nav-theme" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
</header>

<div class="layout">
  <aside>
    <div class="rail-top">
      <div class="lbl"><span class="eyebrow">Yard</span><span class="eyebrow mono" id="stackcount"></span></div>
      <input id="filter" placeholder="filter stacks…" autocomplete="off" />
    </div>
    <div class="rail-list" id="rail"></div>
    <div class="rail-foot"><button class="btn primary" id="newstack" style="width:100%">＋ New stack</button></div>
  </aside>
  <main id="main"></main>
</div>

<div class="dock" id="dock">
  <div class="dock-bar" id="dockbar">
    <span class="ttl">▚ Console</span>
    <span class="last" id="docklast">Ready.</span>
    <span class="x"><button class="btn sm" id="dockclear" title="Clear">Clear</button><button class="btn sm" id="docktoggle" title="Expand / collapse">▾</button></span>
  </div>
  <div class="dock-body"><pre id="console"></pre></div>
</div>

<div id="banner"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const enc=encodeURIComponent;
let stacks=[],current=null,tab="overview",detail=null,drafts={},consoleBuf=[];
const TABS=[["overview","Overview"],["compose","Compose"],["mounts","Mounts"],["permissions","Permissions"],["history","History"],["backups","Backups"],["terminal","Terminal"]];

// ---- theme (persisted) ----
(function(){const s=localStorage.getItem("yd-theme");if(s)document.documentElement.setAttribute("data-theme",s);})();
$("#nav-theme").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");
  const nx=c==="dark"?"light":c==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",nx);localStorage.setItem("yd-theme",nx);};

// ---- api ----
async function api(path,opts){const r=await fetch(path,opts);const t=await r.text();try{return{ok:r.ok,data:JSON.parse(t)};}catch{return{ok:r.ok,data:{raw:t}};}}
async function post(path,body){return api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});}

// ---- console dock ----
function renderConsole(){const pre=$("#console");if(!pre)return;pre.innerHTML="";
  if(!consoleBuf.length){pre.append(el("span","dim","Command output appears here — deploys, backups, git, everything yd runs."));pre.dataset.filled="0";}
  else{for(const l of consoleBuf)pre.append(el("span",l.cls,l.text+"\n"));pre.dataset.filled="1";}
  pre.scrollTop=pre.scrollHeight;
  const last=consoleBuf.length?consoleBuf[consoleBuf.length-1].text:"Ready.";$("#docklast").textContent=last;}
function logLine(cls,text){consoleBuf.push({cls,text});const trimmed=consoleBuf.length>300;if(trimmed)consoleBuf.shift();
  if($("#dock").classList.contains("collapsed")&&(cls==="cmd"||cls==="bad"))setDock(true);
  const pre=$("#console");if(!pre)return;
  // Append-only in the common case; full rebuild only on the first line or a trim.
  if(trimmed||pre.dataset.filled!=="1"){renderConsole();}
  else{pre.append(el("span",cls,text+"\n"));pre.scrollTop=pre.scrollHeight;$("#docklast").textContent=text;}}
function setDock(open){$("#dock").classList.toggle("collapsed",!open);$("#docktoggle").textContent=open?"▾":"▴";}

// Chunked so a large shell paste can't blow String.fromCharCode's argument limit.
function b64enc(str){const bytes=new TextEncoder().encode(str);let bin="";const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(bin);}

  b.append(el("p","muted","Live output from this stack. Switch to Shell to open an interactive terminal inside a service (top, vi, and interactive prompts all work)."));
  const host=el("div");host.id="termhost";host.style.cssText="height:60vh;min-height:300px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0b0e12;padding:6px 8px;";b.append(host);

  // Handlers are wired up SYNCHRONOUSLY (before any await) so a Shell/Logs click
  // during the one-time xterm load is never lost; start() awaits xterm itself.
  let mode="logs";
  function setMode(m){mode=m;const shell=m==="shell";logsBtn.className="btn sm"+(shell?"":" primary");shellBtn.className="btn sm"+(shell?" primary":"");sel.style.display=shell?"":"none";start();}
  logsBtn.onclick=()=>setMode("logs");shellBtn.onclick=()=>setMode("shell");sel.onchange=()=>{if(mode==="shell")start();};

  let startGen=0;
  async function start(){
    const myGen=++startGen;
    closeTerm();host.innerHTML='<div class="muted" style="padding:10px">loading terminal…</div>';
    try{ await ensureXterm(); }
    catch{ if(myGen!==startGen||current!==forC)return;
      dot.className="sig bad";stat.textContent="terminal failed to load";
      host.innerHTML='<div class="muted" style="padding:12px">Could not load the terminal assets. Click Logs or Shell to retry.</div>';return; }
    if(myGen!==startGen||current!==forC)return; // superseded or navigated away
    host.innerHTML="";
    const term=new Terminal({fontSize:12.5,fontFamily:'ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace',theme:{background:"#0b0e12",foreground:"#e7eaed"},cursorBlink:mode==="shell",convertEol:false,scrollback:5000});
    const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(host);try{fit.fit();}catch{}
    const service=mode==="shell"?sel.value:"";
    dot.className="sig warn";stat.textContent="connecting…";
    const {data}=await post("/api/term/open",{compose:forC,mode,service,rows:term.rows,cols:term.cols});
    if(myGen!==startGen){try{term.dispose();}catch{} return;} // superseded by a newer start()
    if(!data.ok){dot.className="sig bad";stat.textContent="failed";term.write("\r\n\x1b[31m"+(data.error||"could not open session")+"\x1b[0m\r\n");return;}
    const session=data.session;
    if(myGen!==startGen){post("/api/term/close",{session});try{term.dispose();}catch{} return;}
    const state={session,stop:false,term,fit};activeTerm=state;
    dot.className="sig ok";stat.textContent=mode==="shell"?("shell · "+service):"following logs";
    if(mode==="shell")term.onData(d=>{if(state.session)post("/api/term/input",{session:state.session,data:b64enc(d)});});
    const ro=new ResizeObserver(()=>{try{fit.fit();if(state.session)post("/api/term/resize",{session:state.session,rows:term.rows,cols:term.cols});}catch{}});ro.observe(host);state.ro=ro;
    // Stop observing/typing to a finished or dropped session; keep the output visible.
    const stopObserving=()=>{try{if(state.ro)state.ro.disconnect();}catch{}};
    (async function poll(){
      while(!state.stop&&activeTerm===state){
        let r;try{r=await post("/api/term/read",{session});}catch{
          // transport dropped — show it honestly (green-on-dead was the bug); the
          // session may still be alive server-side and is reclaimed by reconnect or
          // the idle sweeper.
          dot.className="sig bad";stat.textContent="disconnected — click Logs or Shell to reconnect";stopObserving();break;
        }
        if(state.stop||activeTerm!==state)break;
        if(!r.ok){dot.className="sig bad";stat.textContent="disconnected — click Logs or Shell to reconnect";stopObserving();break;}
        if(r.data&&r.data.data)term.write(b64bytes(r.data.data));
        if(r.data&&r.data.alive===false){term.write("\r\n\x1b[90m[session ended]\x1b[0m\r\n");dot.className="sig";stat.textContent="ended";state.session=null;stopObserving();break;}
      }
    })();
  }
  start();
}

// ---- All stacks (fleet) ----
$("#nav-all").onclick=()=>renderAll();
function setNav(id){["nav-all","nav-git"].forEach(n=>$("#"+n).classList.toggle("on",n===id));}
async function renderAll(){closeTerm();current=null;setNav("nav-all");renderRail();await loadStacks();
  const m=$("#main");m.innerHTML="";
  m.append(el("div","eyebrow","Fleet"));
  const h=el("div","dhead");h.append(el("h1",null,"All stacks"));m.append(h);
  m.append(el("p","muted",`Every stack under the served root. Check guardrails or back up all of them at once, and adopt newly-discovered stacks so Yard Dog manages them. ${stacks.length} stack${stacks.length===1?"":"s"} found.`));
  const bar=el("div","bar");bar.style.marginTop="14px";const B=(l,cls,fn)=>{const x=el("button","btn "+cls,l);x.onclick=fn;bar.append(x);};
  B("Check all","",()=>doFleet("/api/fleet/check","check"));
  B("Back up all","",()=>askConfirm("Back up every stack under the served root?").then(async ok=>{if(!ok)return;logLine("cmd","▶ fleet backup all");fleetResults(await post("/api/fleet/backup",{}));}));
  const un=stacks.filter(s=>!s.adopted);
  if(un.length)B(`Adopt all (${un.length})`,"primary",()=>askConfirm("Adopt "+un.length+" unmanaged stack"+(un.length===1?"":"s")+" into Yard Dog?").then(async ok=>{if(!ok)return;for(const s of un)await post("/api/adopt",{compose:s.compose});logLine("ok","✓ adopted "+un.length+" stack(s)");toast("ok","Adopted "+un.length);renderAll();}));
  m.append(bar);
  const tbl=el("table");const hr=el("tr");["","Stack","Lifecycle","Issues","Managed","Status",""].forEach(h=>hr.append(el("th",null,h)));tbl.append(hr);
  for(const s of stacks){const tr=el("tr");
    tr.append((()=>{const td=el("td");td.append(el("span","sig "+stackSig(s)));return td;})());
    const nm=el("td");const lk=el("button","btn sm",s.name);lk.style.cssText="border:none;background:none;padding:2px 0;color:var(--accent-ink);font-weight:650;";lk.onclick=()=>selectStack(s.compose);nm.append(lk);tr.append(nm);
    const lc=el("td");lc.append(el("span","chip",s.lifecycle));tr.append(lc);
    const is=el("td");if(s.blocks>0)is.append(chip("bad",s.blocks+" blocking"));else if(s.warns>0)is.append(chip("warn",s.warns+" warn"));else is.append(chip("ok","clean"));tr.append(is);
    const mg=el("td");mg.append(s.adopted?chip("ok","managed"):chip("warn","unadopted"));tr.append(mg);
    const st=el("td","fstat");st.dataset.compose=s.compose;st.append(el("span","dim","—"));tr.append(st);
    const ac=el("td");if(!s.adopted){const ab=el("button","btn sm","Adopt");ab.onclick=()=>post("/api/adopt",{compose:s.compose}).then(()=>{logLine("ok","✓ adopted "+s.name);toast("ok","Adopted "+s.name);renderAll();});ac.append(ab);}tr.append(ac);
    tbl.append(tr);}
  m.append(tbl);
  for(const s of stacks)loadFleetStatus(s.compose);}
async function loadFleetStatus(compose){const td=document.querySelector(`td.fstat[data-compose="${CSS.escape(compose)}"]`);if(!td)return;
  const [drift,upd]=await Promise.all([api("/api/drift?compose="+enc(compose)).then(r=>r.data).catch(()=>({})),api("/api/updates?compose="+enc(compose)).then(r=>r.data).catch(()=>({}))]);
  td.innerHTML="";const dc=(drift.items||[]).length,uc=(upd.items||[]).filter(i=>i.status==="UpdateAvailable").length;
  if(drift.available===false)td.append(chip("dim","docker?"));else td.append(dc?chip("warn",dc+" drift"):chip("ok","in sync"));
  if(uc)td.append(chip("warn",uc+" update"+(uc===1?"":"s")));}
async function doFleet(path,label){logLine("cmd","▶ fleet "+label);const {data}=await post(path,{});fleetResults({data});}
function fleetResults(r){const data=(r&&r.data)||{};for(const x of (data.results||[]))logLine(x.ok?"ok":"bad",(x.ok?"✓ ":"✗ ")+x.stack+" — "+(x.summary||""));toast("ok","Fleet action done");loadStacks();}

// ---- Git (proper connect form; no prompts) ----
$("#nav-git").onclick=()=>renderGit();
function updateGitSig(){api("/api/git").then(({data})=>{const s=$("#git-sig");s.className="sig "+(data&&data.remote?"ok":"");});}
async function renderGit(){closeTerm();current=null;setNav("nav-git");renderRail();const m=$("#main");m.innerHTML="";
  m.append(el("div","eyebrow","Config sync"));
  const h=el("div","dhead");h.append(el("h1",null,"Git remote"));m.append(h);
  const {data}=await api("/api/git");
  const box=el("div","form");box.style.marginTop="14px";
  const status=el("div","bar");status.style.marginBottom="14px";
  if(data.remote){status.append(el("span","pill ready","Connected"));status.append(el("span","chip","")); status.lastChild.remove();
    const u=el("span","chip");u.className="chip";u.textContent=data.remote;status.append(u);
    if(data.ahead>=0){const ab=el("span","muted",`${data.ahead} ahead · ${data.behind} behind`);ab.title="Counts reflect the last fetch. Click Refresh to update from the remote.";status.append(ab);}}
  else status.append(el("span","pill notready","Not connected"));
  box.append(status);
  const f=el("div","field");f.append(el("label",null,"Remote URL"));
  const inp=el("input");inp.placeholder="https://github.com/you/config.git  or  git@github.com:you/config.git";inp.value=data.remote||"";f.append(inp);
  f.append(el("div","hint","Sign-in uses your system Git credentials — a credential helper for HTTPS, or your SSH key. Yard Dog never stores tokens. One repo at the served root holds all stack config."));
  box.append(f);
  const bar=el("div","bar");
  const cn=el("button","btn primary",data.remote?"Update remote":"Connect");cn.onclick=()=>{const url=inp.value.trim();if(!url){toast("bad","Enter a remote URL");return;}doGit("/api/git/connect",{url},"connect").then(renderGit);};
  bar.append(cn);
  if(data.remote){const ps=el("button","btn","Push");ps.onclick=()=>doGit("/api/git/push",{},"push").then(renderGit);
    const pl=el("button","btn","Pull");pl.onclick=()=>doGit("/api/git/pull",{},"pull").then(renderGit);
    const rf=el("button","btn","Refresh");rf.title="Fetch remote state to update ahead/behind";rf.onclick=()=>doGit("/api/git/fetch",{},"fetch").then(renderGit);
    bar.append(ps);bar.append(pl);bar.append(rf);}
  box.append(bar);m.append(box);}
async function doGit(path,body,label){logLine("cmd","▶ git "+label);const {data}=await post(path,body);
  if(data.error){logLine("bad","✗ "+data.error);toast("bad","Git "+label+" failed");return;}
  if(data.stdout&&data.stdout.trim())logLine("",data.stdout.trim());
  if(data.stderr&&data.stderr.trim())logLine("bad",data.stderr.trim());
  logLine(data.ok?"ok":"bad",data.ok?"✓ done":"✗ failed");if(data.ok)toast("ok","Git "+label);
  // A pull rewrites on-disk compose files; drop cached drafts so the editor can't
  // save stale content over the pulled changes.
  if(data.ok&&label==="pull")drafts={};
  updateGitSig();}

// ---- actions ----
// Resolves true only when confirmed + run, so callers can skip follow-up work on cancel.
async function confirmAct(msg,path,body,label,danger){if(!await askConfirm(msg,"Confirm",danger))return false;await doAct(path,body,label);return true;}
async function doAct(path,body,label){logLine("cmd","▶ yd "+label);const {data}=await post(path,body);
  if(data.error){logLine("bad","✗ "+data.error);toast("bad",label+" failed");return;}
  let healthUnverified=false;
  if(data.stdout&&data.stdout.trim()){
    const out=data.stdout.trimEnd();
    // Exit 0 alone must not read as "proven healthy": elevate a health-not-verified
    // note to a visible warning rather than a plain console line.
    if(/health NOT verified/i.test(out)){healthUnverified=true;logLine("warn","⚠ "+out);}
    else logLine("",out);
  }
  // A `warning:` line (e.g. the backup not-point-in-time caveat) is a real signal,
  // not dim noise — surface it as a warning.
  if(data.stderr&&data.stderr.trim())logLine(/warning:/i.test(data.stderr)?"warn":"dim",data.stderr.trimEnd());
  if("ok" in data){logLine(data.ok?"ok":"bad",(data.ok?"✓ done":"✗ failed")+(data.exit!=null?" (exit "+data.exit+")":""));
    if(data.ok&&healthUnverified)toast("warn",label+" — health NOT verified");
    else toast(data.ok?"ok":"bad",label+(data.ok?" done":" failed"));}
  loadStacks();}

// ---- new stack (inline panel; no prompts, no kind) ----
$("#newstack").onclick=()=>{closeTerm();current=null;setNav(null);renderRail();const m=$("#main");m.innerHTML="";
  m.append(el("div","eyebrow","New stack"));const h=el("div","dhead");h.append(el("h1",null,"Create a stack"));m.append(h);
  const box=el("div","form");box.style.marginTop="14px";
  const f=el("div","field");f.append(el("label",null,"Name"));
  const inp=el("input");inp.placeholder="e.g. media-server";f.append(inp);
  f.append(el("div","hint","Creates a directory under the served root with a starter docker-compose.yml. Edit it in the Compose tab, then Save & deploy."));box.append(f);
  const pv=el("div","field");pv.append(el("label",null,"Starter compose"));const prev=el("div","preview");prev.textContent=template("your-service");pv.append(prev);box.append(pv);
  inp.addEventListener("input",()=>{prev.textContent=template(inp.value.trim()||"your-service");});
  const bar=el("div","bar");const create=el("button","btn primary","Create stack");
  create.onclick=()=>{const name=inp.value.trim();if(!name){toast("bad","Enter a name");return;}
    const rel=name.replace(/\\/g,"/").replace(/\/+$/,"")+"/docker-compose.yml";
    stacks.unshift({name,compose:rel,lifecycle:"draft",services:0,blocks:0,warns:0,adopted:false});
    drafts[rel]=template(name);current=rel;tab="compose";
    detail={compose:rel,lifecycle:"draft",ready:true,services:[],guardrails:[]};renderRail();renderShell();toast("ok","Draft created — edit and save");};
  const cx=el("button","btn","Cancel");cx.onclick=()=>{$("#main").innerHTML="";$("#main").append(emptyState());};
  bar.append(create);bar.append(cx);box.append(bar);m.append(box);inp.focus();};
function template(svc){return `services:\n  ${svc}:\n    image: \n    restart: unless-stopped\n    mem_limit: 256m\n    healthcheck:\n      test: ["CMD", "true"]   # replace with a real check\n      interval: 30s\n`;}

function emptyState(){const d=el("div","empty");
  d.innerHTML='<svg class="big" viewBox="0 0 34 28" fill="none"><rect x="1.5" y="7" width="24" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M7 7v14M12.5 7v14M18 7v14" stroke="currentColor" stroke-width="1.4" opacity=".6"/><path d="M25.5 11h4.2l2.8 3.2V21h-7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  d.append(el("h2",null,"Pick a stack"));
  d.append(el("p",null,"Choose a stack on the left to inspect its issues, connections, and history — or create a new one. Everything yd runs prints to the console below."));
  return d;}

// ---- init ----
$("#main").append(emptyState());
loadStacks();
</script>
