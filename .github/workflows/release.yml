name: release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
# Builds native `yd` binaries per platform, publishes them with SHA256SUMS as a
# GitHub Release — the artifacts `yd self-update` downloads and verifies.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: yd-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: yd-aarch64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: yd-x86_64-windows.exe
          - os: macos-14
            target: aarch64-apple-darwin
            asset: yd-aarch64-macos
          # macOS Intel (x86_64-apple-darwin / macos-13) omitted — GitHub's
          # Intel-mac runners queue unreliably and block the release. Apple
          # Silicon is covered above; re-add when the runner situation improves.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: app
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "app/target/${{ matrix.target }}/release/yd.exe" "dist/${{ matrix.asset }}"
          else
            cp "app/target/${{ matrix.target }}/release/yd" "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # Build native Linux packages (.deb + .rpm) for amd64 + arm64 from the linux
  # binaries, via nfpm (one config, both formats). See packaging/nfpm.yaml.
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: yd-*-linux   # only the linux binaries; ignore image-digest/dockerbuild
      - name: Build .deb + .rpm (amd64 + arm64)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist out
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) bin=yd-x86_64-linux ;;
              arm64) bin=yd-aarch64-linux ;;
            esac
            cp "staging/$bin/$bin" dist/yd
            for pkg in deb rpm; do
              docker run --rm -v "$PWD:/w" -w /w -e ARCH="$arch" -e VERSION="$VERSION" \
                goreleaser/nfpm package -f packaging/nfpm.yaml -p "$pkg" -t out/
            done
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: out/*

  # Build the control-plane image for each arch NATIVELY (no QEMU) and push each
  # by digest; a separate job merges them into one multi-arch tag. Native arm64
  # (ubuntu-24.04-arm) avoids the ~40-min emulated Rust compile the single-job
  # QEMU build incurred. See issContainerBuildSlow / issContainerCiPublish.
  docker-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: ubuntu-latest
            arch: amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image repo (lowercase owner)
        id: repo
        shell: bash
        run: echo "img=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/yard-dog" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push by digest (native)
        id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"   # no .dockerbuild provenance artifacts
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ steps.repo.outputs.img }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          echo -n "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  # Combine the per-arch digests into ghcr.io/.../yard-dog:{version,latest}.
  docker-manifest:
    needs: docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Image repo (lowercase owner)
        id: repo
        shell: bash
        run: echo "img=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/yard-dog" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true
      - name: Create + push multi-arch manifest (version + latest)
        shell: bash
        run: |
          IMG='${{ steps.repo.outputs.img }}'
          VER="${GITHUB_REF_NAME#v}"
          REFS=""
          for f in /tmp/digests/*; do REFS="$REFS ${IMG}@$(cat "$f")"; done
          docker buildx imagetools create -t "${IMG}:${VER}" -t "${IMG}:latest" $REFS
          docker buildx imagetools inspect "${IMG}:${VER}"

  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4   # the prebuilt binaries
        with:
          path: staging
          pattern: yd-*
      - uses: actions/download-artifact@v4   # the .deb/.rpm packages
        with:
          name: linux-packages
          path: staging/linux-packages
      - name: Collect binaries + checksums
        shell: bash
        run: |
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Sign SHA256SUMS (only if a signing key is configured)
        env:
          YD_SIGNING_KEY: ${{ secrets.YD_SIGNING_KEY }}
        shell: bash
        run: |
          if [ -n "$YD_SIGNING_KEY" ]; then
            bin="staging/yd-x86_64-linux/yd-x86_64-linux"
            chmod +x "$bin"
            # Key comes from $YD_SIGNING_KEY (env), not argv — argv is visible in
            # process listings and can leak into logs.
            "$bin" sign-release --file dist/SHA256SUMS
            ls -la dist/SHA256SUMS.sig
          else
            echo "no YD_SIGNING_KEY secret set — this release is unsigned (checksum only)"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
