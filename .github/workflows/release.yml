name: release

# Cut a release by pushing a version tag, e.g. `git tag v0.1.0 && git push --tags`.
# Builds native `yd` binaries per platform, publishes them with SHA256SUMS as a
# GitHub Release — the artifacts `yd self-update` downloads and verifies.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: yd-x86_64-linux
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: yd-aarch64-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: yd-x86_64-windows.exe
          - os: macos-14
            target: aarch64-apple-darwin
            asset: yd-aarch64-macos
          # macOS Intel (x86_64-apple-darwin / macos-13) omitted — GitHub's
          # Intel-mac runners queue unreliably and block the release. Apple
          # Silicon is covered above; re-add when the runner situation improves.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: app
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "app/target/${{ matrix.target }}/release/yd.exe" "dist/${{ matrix.asset }}"
          else
            cp "app/target/${{ matrix.target }}/release/yd" "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  # Build native Linux packages (.deb + .rpm) for amd64 + arm64 from the linux
  # binaries, via nfpm (one config, both formats). See packaging/nfpm.yaml.
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Build .deb + .rpm (amd64 + arm64)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist out
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) bin=yd-x86_64-linux ;;
              arm64) bin=yd-aarch64-linux ;;
            esac
            cp "staging/$bin/$bin" dist/yd
            for pkg in deb rpm; do
              docker run --rm -v "$PWD:/w" -w /w -e ARCH="$arch" -e VERSION="$VERSION" \
                goreleaser/nfpm package -f packaging/nfpm.yaml -p "$pkg" -t out/
            done
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: out/*

  # Build + push the multi-arch control-plane image (arm64 first) to GHCR, so
  # `docker compose up -d` (packaging/docker/) pulls a real image. Tags the
  # version and `latest`. See issContainerCiPublish / decShipContainerImage.
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        shell: bash
        run: |
          repo_lc="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          img="ghcr.io/${repo_lc}/yard-dog"
          echo "tags=${img}:${GITHUB_REF_NAME#v},${img}:latest" >> "$GITHUB_OUTPUT"
      - name: Build + push (arm64 + amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false

  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
      - name: Collect binaries + checksums
        shell: bash
        run: |
          mkdir -p dist
          find staging -type f -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
