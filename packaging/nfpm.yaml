# nfpm config — builds .deb and .rpm for Yard Dog from a prebuilt `yd` binary.
# Arch + version come from the environment (ARCH=arm64|amd64, VERSION=x.y.z);
# stage the matching binary at ./dist/yd before running nfpm.
#   ARCH=arm64 VERSION=0.1.3 nfpm package -f packaging/nfpm.yaml -p deb -t dist/
name: yard-dog
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: William Weatherholtz <0612@asirobots.com>
description: |
  Single-host Docker Compose manager with mount-path intelligence and
  application-consistent, verified backup. Ships the `yd` CLI and an optional,
  loopback-only browser control plane (installed disabled).
vendor: Yard Dog
homepage: https://github.com/williamweatherholtz/yard_dog
license: AGPL-3.0-or-later
contents:
  - src: ./dist/yd
    dst: /usr/bin/yd
    file_info:
      mode: 0755
  - src: ./packaging/yd.service
    dst: /lib/systemd/system/yd.service
  - src: ./packaging/yd.env
    dst: /etc/yard-dog/yd.env
    type: config|noreplace
  - src: ./README.md
    dst: /usr/share/doc/yard-dog/README.md
